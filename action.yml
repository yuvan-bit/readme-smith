name: readme-smith
description: 本地优先的 README 健康检查与草稿提议 action（仅适用于 GitHub Actions）。
author: yuwan41064
branding:
  icon: book-open
  color: green

inputs:
  mode:
    description: "check = README 腐化时使任务失败；proposal = 写入 README.draft.md 并报告结果。"
    required: false
    default: check
  path:
    description: 要检查的仓库路径。
    required: false
    default: .
  min-score:
    description: check 模式的最低分数（0-100）。
    required: false
    default: "80"
  lang:
    description: proposal 模式的草稿语言（auto、en 或 zh）。
    required: false
    default: auto
  ai:
    description: "proposal 模式的 AI 后端（off、local 或 openai）。默认 off，因此 CI 不需要密钥。"
    required: false
    default: "off"
  changed-only:
    description: "同时检查清单或包 README 发生变化的工作区包。"
    required: false
    default: "false"
  base:
    description: changed-only 模式使用的 git 修订。默认为 HEAD^。
    required: false
    default: ""

outputs:
  score:
    description: check 模式产生的 README 分数。
    value: ${{ steps.check.outputs.score }}
  passed:
    description: check 模式是否通过。
    value: ${{ steps.check.outputs.passed }}
  affected-packages:
    description: changed-only 模式检查的工作区包数量。
    value: ${{ steps.check.outputs.affected }}
  draft-path:
    description: proposal 模式产生的 README.draft.md 绝对路径。
    value: ${{ steps.proposal.outputs.draft-path }}
  has-changes:
    description: proposal 模式是否发现需要新增的章节。
    value: ${{ steps.proposal.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install readme-smith
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: Build readme-smith
      shell: bash
      run: npm run build --prefix "$GITHUB_ACTION_PATH"

    - name: Validate mode
      shell: bash
      env:
        RF_MODE: ${{ inputs.mode }}
      run: |
        if [ "$RF_MODE" != "check" ] && [ "$RF_MODE" != "proposal" ]; then
          echo "mode must be check or proposal (got: $RF_MODE)" >&2
          exit 2
        fi

    - name: Check README
      id: check
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      env:
        RF_PATH: ${{ inputs.path }}
        RF_MIN_SCORE: ${{ inputs.min-score }}
        RF_CHANGED: ${{ inputs.changed-only }}
        RF_BASE: ${{ inputs.base }}
        RF_JSON: ${{ runner.temp }}/readme-smith-check.json
      run: |
        status=0
        args=()
        if [ "$RF_CHANGED" = "true" ]; then
          args+=(--changed)
          if [ -n "$RF_BASE" ]; then
            args+=(--base "$RF_BASE")
          fi
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" check "$RF_PATH" --min-score "$RF_MIN_SCORE" --json "${args[@]}" > "$RF_JSON" || status=$?
        node -e '
          const fs = require("fs");
          try {
            const report = JSON.parse(fs.readFileSync(process.env.RF_JSON, "utf8"));
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `score=${report.score}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${report.passed}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `affected=${Array.isArray(report.affected) ? report.affected.length : 0}\n`);
            }
          } catch {}
        '
        if [ "$status" -ne 0 ]; then
          echo "readme-smith check failed; see the job summary for details." >&2
        fi
        exit "$status"

    - name: Propose README draft
      id: proposal
      if: ${{ inputs.mode == 'proposal' }}
      shell: bash
      env:
        RF_PATH: ${{ inputs.path }}
        RF_LANG: ${{ inputs.lang }}
        RF_AI: ${{ inputs.ai }}
        RF_DRAFT_JSON: ${{ runner.temp }}/readme-smith-draft.json
        RF_DIFF_JSON: ${{ runner.temp }}/readme-smith-diff.json
      run: |
        node "$GITHUB_ACTION_PATH/dist/cli.js" draft "$RF_PATH" --lang "$RF_LANG" --ai "$RF_AI" --json > "$RF_DRAFT_JSON"
        draft_path="$(cd "$RF_PATH" && pwd)/README.draft.md"
        diff_status=0
        node "$GITHUB_ACTION_PATH/dist/cli.js" diff "$RF_PATH" --json > "$RF_DIFF_JSON" || diff_status=$?
        if [ "$diff_status" -eq 2 ]; then
          echo "readme-smith diff failed" >&2
          exit 2
        fi
        RF_DRAFT_PATH="$draft_path" node -e '
          const fs = require("fs");
          const diff = JSON.parse(fs.readFileSync(process.env.RF_DIFF_JSON, "utf8"));
          const count = Array.isArray(diff.changes) ? diff.changes.length : 0;
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `draft-path=${process.env.RF_DRAFT_PATH}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has-changes=${diff.hasChanges}\n`);
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## readme-smith proposal",
              "",
              `- Draft: \`${process.env.RF_DRAFT_PATH}\``,
              `- Sections needing changes: ${count}`,
              "- README.md was not modified. Review the draft, then run `rf apply`.",
              "",
            ].join("\n"));
          }
        '
