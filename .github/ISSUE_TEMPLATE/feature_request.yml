name: Feature request
description: Propose a detector, scoring rule, command or integration.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today? Describe the repository type and the evidence the tool should read.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the command print, write or exit with?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fact extraction
        - README analysis or scoring
        - Draft templates or merge
        - AI boundary or validator
        - CLI or configuration
        - CI, action or pre-commit
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence source
      description: Which files or manifest fields prove this fact? Facts must not be inferred.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This proposal keeps README.md read-only until `rf apply`.
          required: true
        - label: This proposal does not require uploading source code by default.
          required: true
