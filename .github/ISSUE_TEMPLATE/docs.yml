name: Documentation issue
description: Report a wrong, missing or confusing explanation.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README.md → AI boundary
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the sentence or command that misleads you.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked the current README and CONTRIBUTING guide.
          required: true
