name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage

      - name: Dogfood the doctor
        run: node dist/cli.js doctor . --min-score 85

      - name: Dogfood the CI gate
        run: node dist/cli.js check . --min-score 85
