[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-py"
version = "1.2.0"
description = "Parse widget manifests in Python."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
acme-py = "acme.cli:main"
